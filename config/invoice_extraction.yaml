# Invoice Extraction Alias Configuration
# Maps canonical domain field paths to candidate label aliases in documents.
# Aliases are customer-neutral and support English (EN), Vietnamese (VI), and Chinese (ZH).
#
# Contexts:
# - headers: Invoice header-level fields
# - items: Invoice line-item table fields
#
# Party Role Separation (MASTER_SPEC.md Section 20):
# Seller, Buyer, Shipper, Consignee, Exporter, and Importer are distinct roles.
# Aliases for seller.name MUST NOT conflate with Shipper/Exporter.
# Aliases for buyer.name MUST NOT conflate with Consignee/Importer.
#
# Note: Prefix overlaps (e.g. SELLER vs SELLER ADDRESS) are allowed at this config
# layer and are resolved by downstream extraction logic (TASK-006B).

